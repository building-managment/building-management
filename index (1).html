<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر البناية</title>
<meta name="theme-color" content="#1B5E7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر البناية">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root{color-scheme:light}

/* Layout: one centered column (max 920px). Sticky header with building name and a scrolling tab strip; summary first, lists below. Tables sit in their own scroll boxes. */
:root{
  --bg:#F2F5F6;
  --surface:#FFFFFF;
  --ink:#14242B;
  --muted:#58696F;
  --line:#D8E0E3;
  --soft:#E7EDEF;
  --accent:#1B5E7B;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEBF1;
  --ok:#1E7A4F; --ok-soft:#DDF0E6;
  --warn:#8A5700; --warn-soft:#FAEACB;
  --bad:#B3361F; --bad-soft:#F8DDD6;
  --scrim:rgba(14,28,34,.45);
  --font-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#16252C; --ink:#E6EEF1; --muted:#93A5AD; --line:#27383F; --soft:#1D2F37;
    --accent:#5BB5D5; --accent-ink:#062530; --accent-soft:#1B3A47;
    --ok:#5FCB97; --ok-soft:#173A2B; --warn:#E8B450; --warn-soft:#3B2E10; --bad:#F08A72; --bad-soft:#40201A;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#16252C; --ink:#E6EEF1; --muted:#93A5AD; --line:#27383F; --soft:#1D2F37;
  --accent:#5BB5D5; --accent-ink:#062530; --accent-soft:#1B3A47;
  --ok:#5FCB97; --ok-soft:#173A2B; --warn:#E8B450; --warn-soft:#3B2E10; --bad:#F08A72; --bad-soft:#40201A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.65;
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2{margin:0;font-family:var(--font-display);text-wrap:balance}
h2{font-size:16px;font-weight:600}
.wrap{max-width:920px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:16px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand>div{min-width:0}
h1{font-size:21px;font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 12px;color:var(--muted);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#view{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list{overflow:hidden}
.cash{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cash .k{font-size:13.5px;opacity:.85}
.cash .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.3}
.cash .side{font-size:13px;opacity:.85;text-align:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:12px 14px}
.stat .k{color:var(--muted);font-size:12.5px}
.stat .v{font-family:var(--font-display);font-size:19px;font-weight:700}
.stat .v.bad{color:var(--bad)}
.money,.ltr{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-weight:600}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.item.nobadge{grid-template-columns:minmax(0,1fr) auto}
.badge{width:42px;height:42px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.btn{font:inherit;font-weight:500;padding:8px 16px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 12px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.catrow{display:flex;gap:8px;flex-wrap:wrap}
.cat{padding:6px 12px;font-size:13px}
.cat b{font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.bar select{width:auto;max-width:100%}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.empty{padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.note{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--soft)}
.rtitle{padding:14px 14px 4px}
.rtitle .t{font-family:var(--font-display);font-weight:600;font-size:16px}
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.panel h2{font-size:18px}
.err{margin:0;color:var(--bad);font-size:14px}
.rowacts{display:flex;gap:10px;justify-content:flex-start}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;max-width:100%}
@media (max-width:520px){
  .fields{grid-template-columns:1fr}
  .cash .big{font-size:30px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.tab,.chip{transition:background-color .15s,border-color .15s,color .15s}
}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.auth{max-width:420px;margin:28px auto 0;padding:22px;display:flex;flex-direction:column;gap:14px}
.auth h2{font-size:20px}
.auth .hint{margin:0}
</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar">
  <div class="top wrap">
    <div class="brand">
      <div>
        <h1 id="bname">دفتر البناية</h1>
        <div class="sub" id="bsub"></div>
      </div>
      <button class="btn sm" id="settingsBtn" type="button">الإعدادات</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  </div>
  <main class="wrap" id="view"></main>
  <div id="modal"></div>
  <div id="toast" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
document.documentElement.dir='rtl';
document.documentElement.lang='ar';

var MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var CATS=['مولد','كهرباء','مياه','تنظيف','مصعد','صيانة','أخرى'];
var STATUS=[['new','جديد'],['doing','قيد المعالجة'],['done','منتهي']];
var TABS=[['home','الرئيسية'],['apts','الشقق'],['pays','الاشتراكات'],['exps','المصاريف'],['reqs','الصيانة'],['reports','التقارير']];
var REPORTS=[['stmt','كشف حساب شقة'],['late','أرصدة كل الشقق (المتأخرة والمسددة)'],['cats','مصاريف الشهر حسب النوع'],['sum','الملخص الشهري']];

function pad(n){return String(n).padStart(2,'0');}
function nowM(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mlabel(m){var p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0];}
function fmtN(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function num(s){
  s=String(s==null?'':s);
  s=s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});
  s=s.replace(/[٫]/g,'.').replace(/[,،٬\s]/g,'');
  var v=parseFloat(s);return isNaN(v)?NaN:v;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function el(tag,props){
  var e=document.createElement(tag);
  props=props||{};
  Object.keys(props).forEach(function(k){
    var v=props[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  });
  var kids=Array.prototype.slice.call(arguments,2);
  (function add(list){list.forEach(function(c){
    if(c==null||c===false)return;
    if(Array.isArray(c))return add(c);
    e.append(c instanceof Node?c:document.createTextNode(String(c)));
  });})(kids);
  return e;
}

/* ---------- state ---------- */
var db=null,assets=null,dl=null,user=null,canWrite=true,noDb=false,slow=false;
var S={cfg:{name:'دفتر البناية',cur:'$',fee:0,start:nowM(),cash:0},apts:[],pays:[],exps:[],reqs:[]};
var loaded={};
var view=(location.hash||'').slice(1);
if(!TABS.some(function(t){return t[0]===view;}))view='home';
var sel={pays:nowM(),exps:nowM()};
var reqFilter='all';
var rep={type:'late',apt:null,month:nowM()};

function cnt(o){return Object.keys(o).length;}
function sum(list,k){return list.reduce(function(s,x){return s+(Number(x[k])||0);},0);}
function monthsBetween(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.max(0,(y[0]-x[0])*12+y[1]-x[1]+1);}
function chargeMonths(){var out=[],p=nowM().split('-').map(Number),s=S.cfg.start.split('-').map(Number),y=s[0],m=s[1],n=0;while((y<p[0]||(y===p[0]&&m<=p[1]))&&n<600){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}n++;}return out;}
function monthList(){var l=chargeMonths().reverse();return l.length?l:[nowM()];}
function aptDue(a){return (Number(a.fee)||0)*monthsBetween(S.cfg.start,nowM())+(Number(a.opening)||0);}
function aptPaid(a){return sum(S.pays.filter(function(p){return p.aptId===a.id;}),'amount');}
function aptBal(a){return aptDue(a)-aptPaid(a);}
function cashNow(){return (Number(S.cfg.cash)||0)+sum(S.pays,'amount')-sum(S.exps,'amount');}
function aptById(id){return S.apts.filter(function(a){return a.id===id;})[0];}
function aptName(id){if(!id)return 'البناية كلها';var a=aptById(id);return a?('شقة '+a.no+' - '+a.resident):'شقة محذوفة';}
function inMonth(list,m){return list.filter(function(x){return (x.date||'').indexOf(m)===0;});}
function money(n){return el('span',{class:'money'},fmtN(n)+' '+S.cfg.cur);}
function ltr(t){return el('span',{class:'ltr'},t);}

/* ---------- ui helpers ---------- */
var toastTimer;
function toast(msg){var t=$('#toast');t.replaceChildren(el('div',{class:'toast'},msg));clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.replaceChildren();},2800);}
function errMsg(e){
  var c=e&&e.code,m=(e&&e.message)||'';
  if(c==='23503')return 'لا يمكن الحذف لوجود بيانات مرتبطة';
  if(c==='42501'||c==='PGRST301'||/row-level security|JWT/i.test(m))return 'انتهت الجلسة أو لا تملك الصلاحية. سجّل الدخول من جديد';
  if(/Failed to fetch|NetworkError|network/i.test(m))return 'لا يوجد اتصال بالإنترنت';
  return 'تعذّر الحفظ، حاول مرة ثانية';
}
function inp(id,type,val,extra){var p={id:id,type:type,value:val==null?'':String(val)};Object.keys(extra||{}).forEach(function(k){p[k]=extra[k];});return el('input',p);}
function select(id,opts,val){return el('select',{id:id},opts.map(function(o){return el('option',{value:o[0],selected:String(o[0])===String(val)},o[1]);}));}
function field(label,ctrl,hint,full){return el('label',{class:'fld'+(full?' full':'')},el('span',{class:'lbl'},label),ctrl,hint?el('span',{class:'hint'},hint):null);}
function sec(title,act){var kids=Array.prototype.slice.call(arguments,2);return el('section',{class:'sec'},el('div',{class:'sh'},el('h2',{},title),act||null),kids);}
function listCard(items){return el('div',{class:'card list'},items);}
function empty(msg,btn){return el('div',{class:'card empty'},el('div',{},msg),btn||null);}
function btn(label,fn,cls){return el('button',{class:'btn '+(cls||''),type:'button',onclick:fn},label);}
function addBtn(label,fn){return canWrite&&db?btn(label,fn,'primary sm'):null;}
function delBtn(label,fn){
  var b=el('button',{class:'btn sm',type:'button'},label),armed=false,t;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent='تأكيد الحذف؟';b.classList.add('danger');t=setTimeout(function(){armed=false;b.textContent=label;b.classList.remove('danger');},3500);}
    else{clearTimeout(t);fn();}
  });
  return b;
}
function monthSel(id,val,fn){
  var s=select(id,monthList().map(function(m){return [m,mlabel(m)];}),val);
  s.addEventListener('change',function(){fn(s.value);});
  return s;
}
function ensureMonth(v){return monthList().indexOf(v)>=0?v:monthList()[0];}

function openModal(title,content,onSave,saveLabel){
  closeModal();
  var err=el('p',{class:'err',hidden:true});
  var save=el('button',{class:'btn primary',type:'submit'},saveLabel||'حفظ');
  var form=el('form',{class:'panel',novalidate:true,onsubmit:function(ev){
    ev.preventDefault();err.hidden=true;save.disabled=true;
    Promise.resolve().then(onSave).then(function(r){
      if(typeof r==='string'){err.textContent=r;err.hidden=false;save.disabled=false;}
      else closeModal();
    }).catch(function(e){err.textContent=errMsg(e);err.hidden=false;save.disabled=false;});
  }},
    el('h2',{},title),content,err,
    el('div',{class:'rowacts'},save,btn('إلغاء',closeModal)));
  var ov=el('div',{class:'overlay',onclick:function(ev){if(ev.target===ov)closeModal();}},form);
  $('#modal').replaceChildren(ov);
  var f=form.querySelector('input,select');if(f&&!/Android|iPhone|iPad/.test(navigator.userAgent))f.focus();
}
function closeModal(){$('#modal').replaceChildren();}
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeModal();});

/* ---------- writes ---------- */
var TBL={apts:'apartments',pays:'payments',exps:'expenses',reqs:'requests'};
var COLMAP={
  apts:{no:'no',floor:'floor',resident:'resident',type:'kind',phone:'phone',fee:'fee',opening:'opening'},
  pays:{aptId:'apt_id',date:'paid_on',amount:'amount',note:'note'},
  exps:{date:'spent_on',cat:'cat',amount:'amount',note:'note',receipt:'receipt_path'},
  reqs:{title:'title',aptId:'apt_id',date:'opened_on',status:'status',note:'note'}
};
function toRow(col,d){
  var m=COLMAP[col],r={};
  Object.keys(d).forEach(function(k){
    if(!m[k])return;
    var v=d[k];
    if(m[k]==='apt_id'&&v==='')v=null;
    r[m[k]]=v;
  });
  return r;
}
function ok(r){if(r&&r.error)throw r.error;return r;}
function add(col,data){return sb.from(TBL[col]).insert(toRow(col,data)).then(ok).then(function(){toast('تم الحفظ');return reload();});}
function upd(col,id,data){return sb.from(TBL[col]).update(toRow(col,data)).eq('id',id).then(ok).then(function(){return reload();});}
function del(col,id){
  var ex=col==='exps'?S.exps.filter(function(x){return x.id===id;})[0]:null;
  return sb.from(TBL[col]).delete().eq('id',id).then(ok).then(function(){
    if(ex&&ex.receipt)sb.storage.from('receipts').remove([ex.receipt]);
    toast('تم الحذف');
    return reload();
  }).catch(function(e){toast(errMsg(e));});
}
function saveCfg(patch){
  var c=Object.assign({},S.cfg,patch);
  return sb.from('settings').upsert({id:1,name:c.name,cur:c.cur,fee:c.fee,start_month:c.start,cash:c.cash}).then(ok).then(function(){return reload();});
}

/* ---------- forms ---------- */
function aptForm(a){
  var isNew=!a;a=a||{};
  var f={
    no:inp('f-no','text',a.no,{required:true}),
    floor:inp('f-floor','text',a.floor),

function payForm(aptId){

  function setDefault(){
    var a=aptById(sa.value),b=aptBal(a);

function buildReport(){
  var cur=S.cfg.cur,r;
  if(rep.type==='stmt'){
    var a=aptById(rep.apt);
    if(!a)return {title:'كشف حساب شقة',sub:'',head:['التاريخ','البيان','عليه','له','الرصيد'],rows:[],foot:null,num:[2,3,4]};
    var ev=[];
    if(a.opening)ev.push({d:S.cfg.start+'-01',t:'رصيد سابق',dr:a.opening>0?a.opening:0,cr:a.opening<0?-a.opening:0,o:0});
    chargeMonths().forEach(function(m){ev.push({d:m+'-01',t:'اشتراك '+mlabel(m),dr:Number(a.fee)||0,cr:0,o:1});});
    S.pays.filter(function(p){return p.aptId===a.id;}).forEach(function(p){ev.push({d:p.date,t:'دفعة'+(p.note?(' - '+p.note):''),dr:0,cr:Number(p.amount)||0,o:2});});
    ev.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:x.o-y.o;});
    var bal=0,td=0,tc=0;
    var rows=ev.map(function(e){bal+=e.dr-e.cr;td+=e.dr;tc+=e.cr;return [e.d,e.t,e.dr||'',e.cr||'',bal];});
    return {title:'كشف حساب شقة '+a.no,sub:a.resident,head:['التاريخ','البيان','عليه','له','الرصيد'],rows:rows,foot:['','المجموع',td,tc,bal],num:[2,3,4]};
  }
  if(rep.type==='late'){
    var all=S.apts.map(function(a){return {a:a,b:aptBal(a)};}).sort(function(x,y){return y.b-x.b||byNo(x.a,y.a);});
    var td2=0,tp=0,tb=0;
    var rows2=all.map(function(x){
      var du=aptDue(x.a),pa=aptPaid(x.a);td2+=du;tp+=pa;tb+=x.b;
      var st=x.b>0.005?'متأخر':x.b<-0.005?'دفع زيادة':'مسدّد';
      return [x.a.no,x.a.resident,x.a.phone||'',du,pa,x.b,st];
    });
    return {title:'أرصدة كل الشقق',sub:'حتى '+today(),head:['الشقة','الساكن','الهاتف','المستحق','المدفوع','المتبقي','الحالة'],rows:rows2,foot:rows2.length?['','المجموع','',td2,tp,tb,'']:null,num:[3,4,5]};
  }
  var m=ensureMonth(rep.month);
  if(rep.type==='cats'){
    var list=inMonth(S.exps,m),by={},n={};
    list.forEach(function(x){by[x.cat]=(by[x.cat]||0)+(Number(x.amount)||0);n[x.cat]=(n[x.cat]||0)+1;});
    var grand=sum(list,'amount');
    var rows3=Object.keys(by).sort(function(a,b){return by[b]-by[a];}).map(function(c){return [c,n[c],by[c],grand?Math.round(by[c]/grand*100):0];});
    return {title:'مصاريف الشهر حسب النوع',sub:mlabel(m),head:['النوع','عدد الحركات','المبلغ','النسبة %'],rows:rows3,foot:rows3.length?['المجموع',list.length,grand,100]:null,num:[1,2,3]};
  }
  var start=m+'-01';
  var before=(Number(S.cfg.cash)||0)+sum(S.pays.filter(function(p){return (p.date||'')<start;}),'amount')-sum(S.exps.filter(function(x){return (x.date||'')<start;}),'amount');
  var inc=sum(inMonth(S.pays,m),'amount'),out=sum(inMonth(S.exps,m),'amount');
  return {title:'الملخص الشهري',sub:mlabel(m),head:['البند','المبلغ'],
    rows:[['رصيد أول الشهر',before],['المقبوضات',inc],['المصاريف',out],['الفرق (المقبوضات ناقص المصاريف)',inc-out]],
    foot:['رصيد آخر الشهر',before+inc-out],num:[1]};
}

  var foot=r.foot?el('tfoot',{},el('tr',{},r.foot.map(function(v,i){return el('td',{class:isNum(i)?'n':''},cellText(v));}))):null;

function toCSV(r){
  var q=function(v){var s=String(v);return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s;};
  var lines=[[S.cfg.name],[r.title+(r.sub?(' - '+r.sub):'')],['المبالغ بـ '+S.cfg.cur],[],r.head].concat(r.rows);
  if(r.foot)lines.push(r.foot);
  return '﻿'+lines.map(function(l){return l.map(q).join(',');}).join('\r\n');

function sharePDF(r,b){
  if(!window.jspdf||!window.html2canvas){toast('تعذّر تحميل أدوات الـ PDF، تأكد من الإنترنت');return;}
  b.disabled=true;toast('جاري تجهيز الملف...');
  var box=reportNode(r);document.body.append(box);
  var fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  fonts.then(function(){return window.html2canvas(box,{scale:2,backgroundColor:'#ffffff'});}).then(function(canvas){
    var W=box.offsetWidth,sc=canvas.width/W;
    var pageH=Math.floor(277/190*W);
    var stops=[].map.call(box.querySelectorAll('tr'),function(t){return t.offsetTop+t.offsetHeight;});
    var total=box.offsetHeight;
    var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    var start=0,first=true;
    while(start<total-1){
      var end=Math.min(start+pageH,total);
      if(end<total){
        var cand=stops.filter(function(y){return y>start+40&&y<=end;});
        if(cand.length)end=cand[cand.length-1];
      }
      var h=Math.round((end-start)*sc);
      var c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,h);
      ctx.drawImage(canvas,0,Math.round(start*sc),canvas.width,h,0,0,canvas.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,190*h/c.width);
      start=end;
    }
    box.remove();
    var blob=pdf.output('blob');
    var name=r.title+(r.sub?(' '+r.sub):'')+'.pdf';
    var file=new File([blob],name,{type:'application/pdf'});
    b.disabled=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:r.title}).catch(function(e){if(e&&e.name!=='AbortError')savePdfBlob(name,blob);});
    }
    savePdfBlob(name,blob);toast('تم تنزيل الملف، شاركه من مجلد التنزيلات');
  }).catch(function(){box.remove();b.disabled=false;toast('تعذّر تجهيز الملف');});
}

function authErr(e){
  var m=(e&&e.message)||'';
  if(/Invalid login/i.test(m))return 'الاسم أو كلمة السر غير صحيحة';
  if(/not confirmed/i.test(m))return 'لازم تأكد بريدك من الرسالة اللي وصلتك أولاً';
  if(/already registered|already been registered/i.test(m))return 'هذا الاسم مسجّل من قبل، سجّل الدخول';
  if(/Password should|weak/i.test(m))return 'كلمة السر ضعيفة، استخدم 6 أحرف على الأقل';
  if(/rate limit|too many/i.test(m))return 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة';
  if(/fetch|network/i.test(m))return 'لا يوجد اتصال بالإنترنت';
  return 'تعذّر تنفيذ العملية. التفاصيل: '+(m||'غير معروف');
}
